<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice Lab</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4">
        <h1>JavaScript Practice Lab</h1>
        <p>Explore how a webpage responds to user actions.</p>

        <section class="card p-4 mb-4" aria-labelledby="contentHeading">
            <h2 id="contentHeading">Part 2: Change Content</h2>
            <p id="message">Click the button to learn more.</p>
            <button type="button" class="btn btn-primary" onclick="changeMessage()">Learn More</button>
        </section>

        <section class="card p-4 mb-4" aria-labelledby="formHeading">
            <h2 id="formHeading">Part 3: Respond to Input</h2>
            <form id="greetingForm" onsubmit="greetVisitor(); return false;">
                <div class="mb-3">
                    <label for="visitorName" class="form-label">Enter your name:</label>
                    <input type="text" id="visitorName" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <p id="greeting" class="mt-3" aria-live="polite"></p>
        </section>
    </main>

    <!-- jQuery: included for consistency with the earlier website module;
         this lab uses plain JavaScript, not jQuery. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 JavaScript bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Our JavaScript comes after the libraries and page content. -->
    <script>
        function changeMessage() {
            document.getElementById("message").textContent =
        "JavaScript makes websites interactive!";
        }

        function greetVisitor() {
            let name = document.getElementById("visitorName").value;
    document.getElementById("greeting").textContent =
        "Welcome, " + name + "!";        }
    </script>
</body>
</html>
