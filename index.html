<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Using bootstrap 5 framework-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body style="background-color: tan">
    <div class="container-fluid;" >
      <div class="row">
        <!--Ckecklist container-->
        <div class="col-4">
          <div
            class="card mb-3;"
            style="width: 350px; padding: 10px 10px 10px 10px; background-color: #F7ECDD"
            
          >
            <div class="cardbody" >
              <h1 style="text-align: center">Checklist</h1>
              <!--Checklist 1-->
              <button
                type="button"
                class="btn-cirlce btn-primary btn-cirlce;"
                style="width: 20px; height: 20px; border-radius: 45%"
                id="checkButton1"
                onclick = "checkOff1()">
               
                
              </button>
              <label>
                <input
                  type="checklistbox"
                  class="form-control"
                  id="CheckList_1"
                  placeholder="Enter Check"
                  name="checkBox1"
                  style="width: 200px; margin-left: 5px"
                  onkeydown="if (event.key === 'Enter') writeTo1();"
                />
              </label>
              <p id = "Check1Save"></p>
              <!--checklist 2-->
              <button
                type="button"
                class="btn-cirlce btn-primary btn-cirlce"
                style="width: 20px; height: 20px; border-radius: 45%"
                id="checkButton2"
                onclick = "checkOff2()" 
              ></button>
              <label>
                <input
                  type="checklistbox"
                  class="form-control"
                  id="CheckList_2"
                  placeholder="Enter Check"
                  name="checkBox2"
                  style="width: 200px; margin-left: 5px"
                   onkeydown="if (event.key === 'Enter') writeTo2();"
                />
              </label>
              <p id = Check2Save></p></p>
              <!--Checklist 3-->
              <button
                type="button"
                class="btn-cirlce btn-primary btn-cirlce mb-4"
                style="width: 20px; height: 20px; border-radius: 45%; "
                id="checkButton3"
                onclick = "checkOff3()"
              ></button>
              <label>
                <input
                  type="checklistbox"
                  class="form-control"
                  id="CheckList_3"
                  placeholder="Enter Check"
                  name="checkBox3"
                  style="width: 200px; margin-left: 5px; "
                   onkeydown="if (event.key === 'Enter') writeTo3();"
                />
              </label>
              <p id = Check3Save></p></p>
            </div>
          </div>
        </div>
<!--Notepad start-->
        <div class="col-4" style="width: 400px; background-color: #F7ECDD">
          <div>
            <h1 style="text-align: center">Notepad</h1>
            <button
                type="button"
                class="btn-cirlce btn-primary btn-cirlce mb-4"
                style="width: 20px; height: 20px; border-radius: 45%"
                id="checkButton3"
                onclick = "removeNotePad()"
              ></button>
          </div>
          <div class="form-group" >
            <label for="comment"> </label>
            <textarea class="form-control" rows="10" id = "NotePadBox"></textarea>
            
          </div>
        </div>
        <!--links division-->
        <div class="col-2">

          <div class="col-6 mb-4">
            <div class="card" >
              <div class="cardbody" style = "text-align: center; background-color: #F7ECDD">
                <h4> <a href = "https://docs.google.com/document/u/0/">google docs</a><h4>
              </div>
            </div>
          </div>
<div class="col-6">
            <div class="card">
              <div class="cardbody" style = "text-align: center; background-color: #F7ECDD">
                <h4> <a href = "https://drive.google.com/drive/my-drive?dmr=1&ec=wgc-drive-%5Bmodule%5D-goto">google drive</a><h4>
              </div>
            </div>
          </div>
        </div>

        <div class="col-2">

          <div class="col-6 mb-4">
            <div class="card">
              <div class="cardbody" style = "text-align: center; background-color: #F7ECDD">
                <h2> <a href = "https://www.msudenver.edu/studenthub/">MSU</a><h2>
                  
              </div>
            </div>
          </div>
<div class="col-6">
            <div class="card">
              <div class="cardbody" style = "text-align: center; background-color: #F7ECDD">
                <h2>link4<h2>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-4">
        <div class="card mb-3" style="width: 400px; background-color: #F7ECDD">
          <div class="cardbody">
            <h1 style="text-align: center">Calender</h1>
          </div>
        </div>
      </div>
      <div class="col-4">
        <h2>col4</h2>
      </div>
      <div class="col-4">
        <h2>col5</h2>
      </div>
    </div>
    <div class="row">...</div>
  </body>
</html>

<script>
// i realy wanted to make it only 1 function for each of the checklists but i dont understand how the passing of the ID's workvia the funcion
  function writeTo1() {
            let text = document.getElementById("CheckList_1").value;
    document.getElementById("Check1Save").textContent =
        text;   }

   function writeTo2() {
            let text = document.getElementById("CheckList_2").value;
    document.getElementById("Check2Save").textContent =
        text;   }

       function writeTo3() {
            let text = document.getElementById("CheckList_3").value;
    document.getElementById("Check3Save").textContent =
        text;   }
  
  function checkOff1()
  {
    document.getElementById("Check1Save").textContent = ""
  }
  function checkOff2()
  {
    document.getElementById("Check2Save").textContent = ""
  }
  function checkOff3()
  {
    document.getElementById("Check3Save").textContent = ""
  }

  function removeNotePad()
  {
document.getElementById("NotePadBox").value = ""
  }

 
</script>
